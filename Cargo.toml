[package]
name = "tree-sitter-analyzer"
version = "0.1.0"
edition = "2021"
description = "A tree-sitter based CLI tool for code analysis"
license = "MIT"
authors = ["X1r0z <i@exp10it.io>"]

[[bin]]
name = "tsa"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-go = "0.23"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
rayon = "1"
ignore = "0.4"
anyhow = "1"
which = "7"
streaming-iterator = "0.1"

[profile.release]
opt-level = 3
lto = true
