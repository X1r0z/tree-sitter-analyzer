[package]
name = "tree-sitter-analyzer"
version = "0.1.0"
edition = "2021"
description = "A tree-sitter based CLI tool for code analysis"
license = "MIT"
authors = ["X1r0z <i@exp10it.io>"]

[[bin]]
name = "tsa"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.26.6"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-go = "0.25.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
regex-syntax = "0.8"
rayon = "1"
ignore = "0.4"
anyhow = "1"
which = "8.0.1"
streaming-iterator = "0.1"
indicatif = "0.18.4"
rusqlite = { version = "0.39.0", features = ["bundled", "fallible_uint", "functions"] }
blake3 = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
